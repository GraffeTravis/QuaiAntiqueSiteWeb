name: Front tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- scss/main.css scss/main.css.map
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
