<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Administration</h1>
    </div>
</div>

<div class="container my-4">
    <div id="adminMessage"></div>

    <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="restaurant-tab" data-bs-toggle="tab" data-bs-target="#restaurantPanel" type="button" role="tab" aria-controls="restaurantPanel" aria-selected="true">Restaurant</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categoriesPanel" type="button" role="tab" aria-controls="categoriesPanel" aria-selected="false">Catégories</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="foods-tab" data-bs-toggle="tab" data-bs-target="#foodsPanel" type="button" role="tab" aria-controls="foodsPanel" aria-selected="false">Plats</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="menus-tab" data-bs-toggle="tab" data-bs-target="#menusPanel" type="button" role="tab" aria-controls="menusPanel" aria-selected="false">Menus</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="gallery-tab" data-bs-toggle="tab" data-bs-target="#galleryPanel" type="button" role="tab" aria-controls="galleryPanel" aria-selected="false">Galerie</button>
        </li>
    </ul>

    <div class="tab-content border border-top-0 p-3" id="adminTabsContent">
        <div class="tab-pane fade show active" id="restaurantPanel" role="tabpanel" aria-labelledby="restaurant-tab" tabindex="0">
            <form id="restaurantForm" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="restaurantName" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="restaurantName" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="restaurantMaxGuest" class="form-label">Capacité maximale</label>
                    <input type="number" min="1" class="form-control" id="restaurantMaxGuest" required>
                </div>
                <div class="col-12">
                    <label for="restaurantDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="restaurantDescription" rows="3" required></textarea>
                </div>
                <div class="col-6 col-md-3">
                    <label for="amOpeningStart" class="form-label">Midi début</label>
                    <input type="time" class="form-control" id="amOpeningStart">
                </div>
                <div class="col-6 col-md-3">
                    <label for="amOpeningEnd" class="form-label">Midi fin</label>
                    <input type="time" class="form-control" id="amOpeningEnd">
                </div>
                <div class="col-6 col-md-3">
                    <label for="pmOpeningStart" class="form-label">Soir début</label>
                    <input type="time" class="form-control" id="pmOpeningStart">
                </div>
                <div class="col-6 col-md-3">
                    <label for="pmOpeningEnd" class="form-label">Soir fin</label>
                    <input type="time" class="form-control" id="pmOpeningEnd">
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary" type="submit">Enregistrer</button>
                </div>
            </form>
        </div>

        <div class="tab-pane fade" id="categoriesPanel" role="tabpanel" aria-labelledby="categories-tab" tabindex="0">
            <form id="categoryForm" class="row g-3 mb-4">
                <input type="hidden" id="categoryId">
                <div class="col-12 col-md-8">
                    <label for="categoryTitle" class="form-label">Titre</label>
                    <input type="text" class="form-control" id="categoryTitle" required>
                </div>
                <div class="col-12 col-md-4 d-flex align-items-end gap-2">
                    <button class="btn btn-primary" type="submit">Enregistrer</button>
                    <button class="btn btn-secondary" type="button" id="resetCategoryForm">Annuler</button>
                </div>
            </form>
            <div id="categoriesList" class="d-grid gap-2"></div>
        </div>

        <div class="tab-pane fade" id="foodsPanel" role="tabpanel" aria-labelledby="foods-tab" tabindex="0">
            <form id="foodForm" class="row g-3 mb-4">
                <input type="hidden" id="foodId">
                <div class="col-12 col-md-6">
                    <label for="foodTitle" class="form-label">Titre</label>
                    <input type="text" class="form-control" id="foodTitle" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="foodPrice" class="form-label">Prix</label>
                    <input type="number" min="0" class="form-control" id="foodPrice" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="foodCategories" class="form-label">Catégories</label>
                    <select class="form-select" id="foodCategories" multiple></select>
                </div>
                <div class="col-12">
                    <label for="foodDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="foodDescription" rows="3" required></textarea>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary" type="submit">Enregistrer</button>
                    <button class="btn btn-secondary" type="button" id="resetFoodForm">Annuler</button>
                </div>
            </form>
            <div id="foodsAdminList" class="d-grid gap-2"></div>
        </div>

        <div class="tab-pane fade" id="menusPanel" role="tabpanel" aria-labelledby="menus-tab" tabindex="0">
            <form id="menuForm" class="row g-3 mb-4">
                <input type="hidden" id="menuId">
                <div class="col-12 col-md-6">
                    <label for="menuTitle" class="form-label">Titre</label>
                    <input type="text" class="form-control" id="menuTitle" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="menuPrice" class="form-label">Prix</label>
                    <input type="number" min="0" class="form-control" id="menuPrice" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="menuCategories" class="form-label">Catégories</label>
                    <select class="form-select" id="menuCategories" multiple></select>
                </div>
                <div class="col-12">
                    <label for="menuDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="menuDescription" rows="3" required></textarea>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary" type="submit">Enregistrer</button>
                    <button class="btn btn-secondary" type="button" id="resetMenuForm">Annuler</button>
                </div>
            </form>
            <div id="menusAdminList" class="d-grid gap-2"></div>
        </div>

        <div class="tab-pane fade" id="galleryPanel" role="tabpanel" aria-labelledby="gallery-tab" tabindex="0">
            <form id="adminPictureForm" class="row g-3 mb-4">
                <div class="col-12 col-md-5">
                    <label for="adminPictureTitle" class="form-label">Titre</label>
                    <input type="text" class="form-control" id="adminPictureTitle" maxlength="255" required>
                </div>
                <div class="col-12 col-md-5">
                    <label for="adminPictureFile" class="form-label">Image</label>
                    <input type="file" class="form-control" id="adminPictureFile" accept="image/jpeg,image/png,image/webp" required>
                </div>
                <div class="col-12 col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit" id="adminPictureSubmit">Ajouter</button>
                </div>
            </form>
            <div id="picturesAdminList" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3"></div>
        </div>
    </div>
</div>
